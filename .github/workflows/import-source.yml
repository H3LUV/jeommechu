name: Import Jeommechu from legacy repository

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/import-source.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout new repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Checkout legacy source
        uses: actions/checkout@v4
        with:
          repository: H3LUV/extra-innings-take2-preview
          ref: jeommechu-cloudflare
          path: _legacy

      - name: Import project
        shell: bash
        run: |
          set -euo pipefail

          cp -a _legacy/jeommechu/. ./
          rm -rf android
          cp -a _legacy/android ./android

          mkdir -p .github/workflows
          cp _legacy/.github/workflows/build-jeommechu-apk.yml .github/workflows/build-jeommechu-apk.yml

          python3 - <<'PY'
          from pathlib import Path
          p = Path('.github/workflows/build-jeommechu-apk.yml')
          text = p.read_text(encoding='utf-8')
          text = text.replace('jeommechu-cloudflare', 'main')
          p.write_text(text, encoding='utf-8')
          PY

          cat > .github/workflows/ci.yml <<'YAML'
          name: Jeommechu CI

          on:
            pull_request:
              branches: [main]
            push:
              branches: [main]
              paths:
                - 'src/**'
                - 'public/**'
                - 'package.json'
                - 'wrangler.jsonc'
                - '.github/workflows/ci.yml'

          permissions:
            contents: read

          jobs:
            check:
              runs-on: ubuntu-latest
              steps:
                - uses: actions/checkout@v4
                - uses: actions/setup-node@v4
                  with:
                    node-version: '22'
                    cache: npm
                - run: npm install
                - run: npm run check
          YAML

          cat > README.md <<'MD'
          # 점메추

          현재 위치 반경 1km의 실제 식당을 추천하고, 개인·팀 점심 결정을 돕는 웹/안드로이드 서비스입니다.

          ## 구성

          - `src/` Cloudflare Worker API 및 팀 방 Durable Object
          - `public/` 웹 프런트엔드
          - `android/` Android WebView APK 빌드 소스
          - `.github/workflows/` CI 및 APK 빌드
          - `wrangler.jsonc` Cloudflare Workers 설정

          ## 개발

          ```bash
          npm install
          npm run check
          npm run dev
          ```

          배포 시 Cloudflare Worker에 `KAKAO_REST_API_KEY` secret이 필요합니다.
          MD

          rm -rf _legacy
          rm -f .github/workflows/import-source.yml

      - name: Commit imported project
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'No changes to commit.'
            exit 0
          fi
          git commit -m 'Import Jeommechu from legacy repository'
          git push origin HEAD:main
