name: Build Jeommechu APK

on:
  pull_request:
    branches:
      - main
    paths:
      - "android/**"
      - ".github/workflows/build-jeommechu-apk.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Generate Android project
        run: |
          chmod +x android/build-apk.sh android/patch-v1.0.2.sh
          ./android/build-apk.sh
          ./android/patch-v1.0.2.sh

      - name: Build installable APK
        working-directory: android/app-project
        run: gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Prepare artifact
        run: |
          mkdir -p android/output
          cp android/app-project/app/build/outputs/apk/debug/app-debug.apk android/output/jeommechu-v1.0.2.apk
          sha256sum android/output/jeommechu-v1.0.2.apk > android/output/jeommechu-v1.0.2.sha256

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: jeommechu-apk-v1.0.2
          path: android/output/*
          if-no-files-found: error
          retention-days: 30
